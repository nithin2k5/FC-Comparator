station:
  name: Station-1
camera:
  source: file
  index: 0
  backend: auto
  width: 1920
  height: 1080
  fps: 30
  autofocus: false
  focus: null
  exposure: null
  warmup_frames: 5
  file_path: ../samples/boards/board_P001_ok.jpg
taxonomy:
  classes: [round, fork_left, fork_right, small]
  groups:
    fork: [fork_left, fork_right]
  mirror: {fork_left: fork_right, fork_right: fork_left}
detector:
  backend: auto
  model_path: ../models/clip_detector.pt
  min_score: 0.25
  confidence_threshold: 0.6
  imgsz: 960
  device: cpu
  template: {scale: 0.5, max_per_class: 10, min_score: 0.55, temperature: 0.04}
layout: {match_tolerance: 0.6, max_shift_px: 200.0, max_rotation_deg: 8.0, min_matched_fraction: 0.5}
annotations:
  dir: ../samples/annotations
training: {base_model: yolo11n.pt, epochs: 60, imgsz: 960, batch: 8, val_split: 0.2, mirror: true, patience: 20,
  workdir: ../runs/detector}
compare:
  mode: master
alert:
  backend: console
  buzzer_mode: pulse
  buzzer_seconds: 2.0
  ok_light_seconds: 0.0
  gpio: {green_pin: 17, red_pin: 27, buzzer_pin: 22, active_high: true}
  usb_relay: {port: COM3, baudrate: 9600, green_channel: 1, red_channel: 2, buzzer_channel: 3}
  modbus: {host: 192.168.0.10, port: 502, unit_id: 1, green_coil: 0, red_coil: 1, buzzer_coil: 2, timeout: 0.5}
security:
  setup_password: pbkdf2_sha256$200000$f7f2012437381db47d00e79580e16017$c92040281e2d248d78a0c9371b34ffbf396aef1a23083f000de018627f6f6f21
  supervisor_pin: pbkdf2_sha256$200000$c32465c0d7d720e41950572856528d15$40fbbf25cb42ce6df878f046b78d277874913140f99a0328d788452966c95f90
  lock_on_ng: true
storage:
  database: ../data/inspections.db
  image_dir: ../data/images
  save_ok_every_n: 20
  save_raw_images: false
barcode:
  part_pattern: ^(?P<part>[A-Za-z0-9\-_]+)$
  operator_prefix: 'OP:'
trigger:
  key: F9
  gpio_pin: null
ui:
  fullscreen: false
  preview_fps: 15
  appearance: light
  scale: 1.0
parts:
  P001:
    description: Harness A
    cables: 4
    pattern: [round, fork_left, small, round]
  P002:
    description: Harness B
    cables: 4
    pattern: [fork_right, fork_right, small, fork_right]
